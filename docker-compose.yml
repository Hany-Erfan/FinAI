version: "3.9"

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - host-agent
    environment:
      - VITE_API_URL=http://localhost:8000
    command: [ "npm", "run", "dev", "--", "--host", "0.0.0.0" ]

  host-agent:
    build:
      context: .
      dockerfile: backend/host_agent/Dockerfile
    container_name: host-agent
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
    depends_on:
      retail-agent:
        condition: service_started
      guardrails-service:
        condition: service_healthy
      - postgres_db
    environment:
      - PYTHONUNBUFFERED=1
      - UVICORN_LOG_LEVEL=debug
      - LOG_LEVEL=debug
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - JWT_SECRET_KEY=your-super-secret-jwt-key-change-in-production-min-32-chars
      - JWT_EXPIRE_MINUTES=480
      - FAQ_AGENT_URL=http://faq-agent:8001
      - RETAIL_AGENT_URL=http://retail-agent:8002
      - SUMMARY_AGENT_URL=http://summary-agent:8003
      - BANK_URL=http://bank-server:8006
      - DATABASE_URL=postgresql://agentixBuddy:agentixsecret@postgres_db:5432/agentixBuddy
      - PORT=8000
      - GUARDRAILS_URL=http://guardrails-service:8005
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY}
      - LANGFUSE_BASE_URL=${LANGFUSE_BASE_URL}
    command: >
      uvicorn backend.host_agent.main:app --host 0.0.0.0 --port 8000 --reload --log-level debug

  faq-agent:
    build:
      context: .
      dockerfile: backend/agents/faq_agent/Dockerfile
    container_name: faq-agent
    ports:
      - "8001:8001"
    volumes:
      - ./backend:/app/backend
    environment:
      - PYTHONUNBUFFERED=1
      - UVICORN_LOG_LEVEL=debug
      - LOG_LEVEL=debug
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - JWT_SECRET_KEY=your-super-secret-jwt-key-change-in-production-min-32-chars
      - JWT_EXPIRE_MINUTES=480
      - VECTOR_DB_SERVICE_URL=http://vector-db-service:8004/vector_db_service
      - PORT=8001
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY}
      - LANGFUSE_BASE_URL=${LANGFUSE_BASE_URL}
    command: >
      python -m uvicorn backend.agents.faq_agent.server:faq_app --host 0.0.0.0 --port 8001 --reload --log-level debug --use-colors

  retail-agent:
    build:
      context: .
      dockerfile: backend/agents/retail_agent/Dockerfile
    container_name: retail-agent
    ports:
      - "8002:8002"
    volumes:
      - ./backend:/app/backend
    depends_on:
      - bank-server
    environment:
      - PYTHONUNBUFFERED=1
      - UVICORN_LOG_LEVEL=debug
      - LOG_LEVEL=debug
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - BANK_URL=http://bank-server:8006
      - JWT_SECRET_KEY=your-super-secret-jwt-key-change-in-production-min-32-chars
      - JWT_EXPIRE_MINUTES=480
      - PORT=8002
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY}
      - LANGFUSE_BASE_URL=${LANGFUSE_BASE_URL}
    command: >
      python -m uvicorn backend.agents.retail_agent.server:retail_app --host 0.0.0.0 --port 8002 --reload --log-level debug --use-colors
      
  summary-agent:
    build:
      context: .
      dockerfile: backend/agents/summary_agent/Dockerfile
    container_name: summary-agent
    ports:
      - "8003:8003"
    volumes:
      - ./backend:/app/backend
    environment:
      - PYTHONUNBUFFERED=1
      - UVICORN_LOG_LEVEL=debug
      - LOG_LEVEL=debug
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - REPO_URL=http://repository-service:8007
      - JWT_SECRET_KEY=your-super-secret-jwt-key-change-in-production-min-32-chars
      - JWT_EXPIRE_MINUTES=480
      - PORT=8003
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY}
      - LANGFUSE_BASE_URL=${LANGFUSE_BASE_URL}
    command: >
      python -m uvicorn backend.agents.summary_agent.server:summary_app --host 0.0.0.0 --port 8003 --reload --log-level debug --use-colors

  db:
    build:
      context: .
      dockerfile: backend/postgres_db/Dockerfile
    container_name: db
    volumes:
      - ./backend:/app/backend

  bank-server:
    build:
      context: .
      dockerfile: backend/bank_server/Dockerfile
    container_name: bank-server
    ports:
      - "8006:8006"
    volumes:
      - ./backend:/app/backend
    environment:
      - PYTHONUNBUFFERED=1
      - UVICORN_LOG_LEVEL=debug
      - LOG_LEVEL=debug
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - JWT_SECRET_KEY=your-super-secret-jwt-key-change-in-production-min-32-chars
      - JWT_EXPIRE_MINUTES=480
      - PORT=8006
    command: >
      python -m uvicorn backend.bank_server.server:bank_app --host 0.0.0.0 --port 8006 --reload --log-level debug --use-colors

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  repository-service:
    build:
      context: .
      dockerfile: backend/services/repository_service/Dockerfile
    container_name: repository-service
    ports:
      - "8007:8007"
    volumes:
      - ./backend:/app/backend
    environment:
      - PYTHONUNBUFFERED=1
      - UVICORN_LOG_LEVEL=debug
      - LOG_LEVEL=debug
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - DATABASE_URL=postgresql://agentixBuddy:agentixsecret@postgres_db:5432/agentixBuddy
      - JWT_SECRET_KEY=your-super-secret-jwt-key-change-in-production-min-32-chars
      - JWT_EXPIRE_MINUTES=480
      - PORT=8007
    command: >
      python -m uvicorn backend.services.repository_service.server:repository_app --host 0.0.0.0 --port 8007 --reload --log-level debug --use-colors

  vector-db-service:
    build:
      context: .
      dockerfile: backend/services/vector_db_service/Dockerfile
    container_name: vector-db-service
    ports:
      - "8004:8004"
    volumes:
      - ./backend:/app/backend
    depends_on:
      - qdrant
    environment:
      - PYTHONUNBUFFERED=1
      - UVICORN_LOG_LEVEL=debug
      - LOG_LEVEL=debug
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - JWT_SECRET_KEY=your-super-secret-jwt-key-change-in-production-min-32-chars
      - JWT_EXPIRE_MINUTES=480
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_API_KEY=
      - VECTOR_DB_COLLECTION=sample_bank_products
      - PORT=8004
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY}
      - LANGFUSE_BASE_URL=${LANGFUSE_BASE_URL}
    command: >
      python -m uvicorn backend.services.vector_db_service.server:vector_db_app --host 0.0.0.0 --port 8004 --reload --log-level debug --use-colors

  guardrails-service:
    build:
      context: .
      dockerfile: backend/services/guardrails/Dockerfile
      args:
        - GUARDRAILS_API_KEY=${GUARDRAILS_API_KEY}
    container_name: guardrails-service
    ports:
      - "8005:8005"
    volumes:
      - ./backend:/app/backend
    environment:
      - GUARDRAILS_API_KEY=${GUARDRAILS_API_KEY}
      - GUARDRAILS_LLM_MODEL=${GUARDRAILS_LLM_MODEL}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - OPENAI_API_KEY=${GOOGLE_API_KEY}
      - GEMINI_API_KEY=${GOOGLE_API_KEY}
      - PYTHONUNBUFFERED=1
      - PORT=8005
      - TOKENIZERS_PARALLELISM=false
      - OMP_NUM_THREADS=1
      - MKL_NUM_THREADS=1
      - NLTK_DATA=/usr/local/nltk_data
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8005/health')\""]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s
    command: >
      python -m backend.services.guardrails.server

  postgres_db:
    image: postgres:16
    container_name: app_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agentixBuddy}
      POSTGRES_USER: ${POSTGRES_USER:-agentixBuddy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agentixsecret}
    ports:
      - "5432:5432"
    volumes:
     - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agentixBuddy} -d ${POSTGRES_DB:-agentixBuddy}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


volumes:
  qdrant_data:
  postgres_data:
