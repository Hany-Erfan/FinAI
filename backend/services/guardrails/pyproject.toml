[project]
name = "guardrails-service"
version = "0.1.0"
description = "Guardrails validation service"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.123.0",
    "uvicorn==0.38.0",
    "pydantic==2.12.5",
    "requests==2.32.5",
    "observability",
    "guardrails-ai>=0.9.1",
    "google-generativeai==0.8.6",
    "nltk>=3.9,<4",
    "observability"
]

[tool.uv.sources]
observability = { path = "../../observability" }

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["server"]