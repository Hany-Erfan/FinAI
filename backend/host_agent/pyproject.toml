[project]
name = "host-agent"
version = "0.1.0"
description = "Orchestrator Service"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.123.0",
    "uvicorn==0.38.0",
    "google-generativeai==0.8.5",
    "google-adk==1.21.0",
    "pyjwt==2.10.1",
    "python-multipart==0.0.20",
    "python-jose[cryptography]==3.5.0",
    "httpx==0.28.1",
    "requests==2.32.5",
    "pydantic==2.12.5",
    "qdrant-client==1.16.2",
    "fastembed==0.7.4",
    "google-genai==1.55.0",
    "langfuse==3.9.2",
    "openinference-instrumentation-google-adk==0.1.6",
    "a2a-protocol==0.1.0",
    "a2a-sdk==0.3.21",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.13.0",
    "observability"
]

[tool.uv.sources]
observability = { path = "../../observability" }

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main", "remote_agent_connection", "routing_agent"]
