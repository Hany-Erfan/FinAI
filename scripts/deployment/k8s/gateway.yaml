apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
  namespace: agentixbuddy
data:
  nginx.conf: |
    events {}

    http {
      client_max_body_size 20M;

      server {
        listen 80;
        server_name _;

        # Frontend
        location / {
          proxy_pass http://frontend:80;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Host Agent API
        location /api/ {
          rewrite ^/api/?(.*)$ /$1 break;
          proxy_pass http://host-agent:8000/;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Vector DB Service (for backoffice)
        location /vector-db/ {
          rewrite ^/vector-db/?(.*)$ /$1 break;
          proxy_pass http://vector-db-service:8004;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Guardrails Service
        # location /guardrails_service/ {
        #   rewrite ^/guardrails_service/?(.*)$ /$1 break;
        #   proxy_pass http://guardrails-service:8005/;
        #   proxy_set_header Host $host;
        #   proxy_set_header X-Real-IP $remote_addr;
        #   proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #   proxy_set_header X-Forwarded-Proto $scheme;
        # }

        # Repository Service
        location /repository/ {
          rewrite ^/repository/?(.*)$ /$1 break;
          proxy_pass http://repository-service:8007/;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
        }

        # FAQ Agent
        location /faq-agent/ {
          rewrite ^/faq-agent/?(.*)$ /$1 break;
          proxy_pass http://faq-agent:8001/;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Summary Agent
        location /summary-agent/ {
          rewrite ^/summary-agent/?(.*)$ /$1 break;
          proxy_pass http://summary-agent:8003/;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Grafana Dashboard
        location /grafana/ {
          proxy_pass http://lgtm:3000;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_http_version 1.1;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection "upgrade";
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: agentixbuddy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
      volumes:
        - name: config
          configMap:
            name: gateway-config
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: agentixbuddy
spec:
  type: LoadBalancer
  selector:
    app: gateway
  ports:
    - port: 80
      targetPort: 80
  loadBalancerIP: STATIC_IP_PLACEHOLDER