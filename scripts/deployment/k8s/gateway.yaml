apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
  namespace: finai
data:
  nginx.conf: |
    events {}

    http {
      client_max_body_size 20M;

      # HTTP Server (Redirects to HTTPS except for ACME)
      server {
        listen 80;
        server_name _;

        # ACME HTTP-01 challenge for Let's Encrypt (Must remain on HTTP)
        location /.well-known/acme-challenge/ {
          proxy_pass http://acme-solver.finai.svc.cluster.local:8089;
          proxy_set_header Host $host;
        }

        # Redirect everything else to HTTPS
        location / {
          return 301 https://$host$request_uri;
        }
      }

      # HTTPS Server
      server {
        listen 443 ssl;
        server_name app.staging.finai.com;

        ssl_certificate /etc/nginx/certs/tls.crt;
        ssl_certificate_key /etc/nginx/certs/tls.key;

        # Frontend
        location / {
          proxy_pass http://frontend:80;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ACME HTTP-01 challenge for Let's Encrypt
        location /.well-known/acme-challenge/ {
          proxy_pass http://acme-solver.finai.svc.cluster.local:8089;
          proxy_set_header Host $host;
        }

        # Host Agent API
        location /api/ {
          rewrite ^/api/?(.*)$ /$1 break;
          proxy_pass http://host-agent:8000/;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Vector DB Service (for backoffice)
        location /vector-db/ {
          rewrite ^/vector-db/?(.*)$ /$1 break;
          proxy_pass http://vector-db-service:8004;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Repository Service
        location /repository/ {
          rewrite ^/repository/?(.*)$ /$1 break;
          proxy_pass http://repository-service:8007/;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
        }

        # FAQ Agent
        location /faq-agent/ {
          rewrite ^/faq-agent/?(.*)$ /$1 break;
          proxy_pass http://faq-agent:8001/;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Summary Agent
        location /summary-agent/ {
          rewrite ^/summary-agent/?(.*)$ /$1 break;
          proxy_pass http://summary-agent:8003/;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Grafana Dashboard
        location /grafana/ {
          proxy_pass http://lgtm:3000;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_http_version 1.1;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection "upgrade";
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: finai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
            - containerPort: 443
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
            - name: tls-certs
              mountPath: /etc/nginx/certs
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: gateway-config
        - name: tls-certs
          secret:
            secretName: finai-tls
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: finai
spec:
  type: LoadBalancer
  selector:
    app: gateway
  ports:
    - name: http
      port: 80
      targetPort: 80
    - name: https
      port: 443
      targetPort: 443
  loadBalancerIP: STATIC_IP_PLACEHOLDER
