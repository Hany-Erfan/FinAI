apiVersion: apps/v1
kind: Deployment
metadata:
  name: guardrails-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: guardrails-service
  template:
    metadata:
      labels:
        app: guardrails-service
    spec:
      nodeSelector:
        cloud.google.com/gke-spot: "true"
      containers:
        - name: guardrails-service
          image: IMAGE_PLACEHOLDER
          ports:
            - containerPort: 8005
          envFrom:
            - configMapRef:
                name: app-env
            - secretRef:
                name: api-keys
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: lgtm:4317
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: grpc
            - name: OTEL_TRACES_ENABLED
              value: "true"
            - name: OTEL_SERVICE_NAME
              value: guardrails-service
            - name: LOG_LOKI_ENDPOINT
              value: lgtm:4317
            - name: LOG_SERVICE_NAME
              value: guardrails-service
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 200m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: guardrails-service
spec:
  type: ClusterIP
  selector:
    app: guardrails-service
  ports:
    - port: 8005
      targetPort: 8005
      protocol: TCP