apiVersion: apps/v1
kind: Deployment
metadata:
  name: repository-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: repository-service
  template:
    metadata:
      labels:
        app: repository-service
    spec:
      nodeSelector:
        cloud.google.com/gke-spot: "true"
      containers:
        - name: repository-service
          image: IMAGE_PLACEHOLDER
          ports:
            - containerPort: 8007
          envFrom:
            - configMapRef:
                name: app-env
            - secretRef:
                name: api-keys
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 200m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: repository-service
spec:
  type: ClusterIP
  selector:
    app: repository-service
  ports:
    - port: 8007
      targetPort: 8007
      protocol: TCP