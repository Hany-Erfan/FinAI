apiVersion: apps/v1
kind: Deployment
metadata:
  name: summary-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: summary-agent
  template:
    metadata:
      labels:
        app: summary-agent
    spec:
      nodeSelector:
        cloud.google.com/gke-spot: "true"
      containers:
        - name: summary-agent
          image: IMAGE_PLACEHOLDER
          ports:
            - containerPort: 8003
          envFrom:
            - configMapRef:
                name: app-env
            - secretRef:
                name: api-keys
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: REPO_URL
              value: http://repository-service:8007
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 200m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: summary-agent
spec:
  type: ClusterIP
  selector:
    app: summary-agent
  ports:
    - port: 8003
      targetPort: 8003
      protocol: TCP