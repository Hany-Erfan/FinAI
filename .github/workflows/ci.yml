name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY || 'dummy_key' }}
      ORCHESTRATOR_GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY || 'dummy_key' }}
      SERVICES_GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY || 'dummy_key' }}
      LANGFUSE_SECRET_KEY: dummy
      LANGFUSE_PUBLIC_KEY: dummy
      LANGFUSE_BASE_URL: http://localhost:3000

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install Docker Compose
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose

      - name: Build and start services
        run: |
          docker-compose up -d --build

      - name: Wait for services to be ready
        run: |
          echo "Waiting for services to start..."
          # Give it some time to start up
          sleep 30
          docker-compose ps

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements.txt

      - name: Run Integration Tests
        run: |
          pytest tests/test_integration.py

      - name: Cleanup
        if: always()
        run: |
          docker-compose down
