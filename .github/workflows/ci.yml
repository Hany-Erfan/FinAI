name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY || 'dummy_key' }}
      ORCHESTRATOR_GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY || 'dummy_key' }}
      SERVICES_GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY || 'dummy_key' }}
      LANGFUSE_SECRET_KEY: dummy
      LANGFUSE_PUBLIC_KEY: dummy
      LANGFUSE_BASE_URL: http://localhost:3000

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install Docker Compose
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose

      - name: Build and start services
        run: |
          docker-compose up -d --build

      - name: Wait for services to be ready
        run: |
          echo "Waiting for services to start..."
          for i in $(seq 1 24); do
            echo "Check $i/24"
            docker-compose ps

            STATUS=$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}no-healthcheck{{end}}' guardrails-service 2>/dev/null || echo "missing")
            echo "guardrails-service health: $STATUS"

            if [ "$STATUS" = "healthy" ]; then
              echo "guardrails-service is healthy"
              break
            fi

            if [ "$i" -eq 24 ]; then
              echo "guardrails-service did not become healthy in time"
              docker-compose ps
              docker-compose logs --no-color guardrails-service host-agent faq-agent retail-agent bank-server vector-db-service
              exit 1
            fi

            sleep 10
          done

          docker-compose ps
          docker-compose logs --no-color guardrails-service host-agent faq-agent retail-agent bank-server vector-db-service

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements.txt

      - name: Run Integration Tests
        run: |
          pytest tests/test_integration.py -v

      - name: Run Backoffice Auth Tests
        run: |
          pytest tests/test_backoffice_auth.py -v

      - name: Dump container logs on failure
        if: failure()
        run: |
          docker-compose ps
          docker-compose logs --no-color

      - name: Cleanup
        if: always()
        run: |
          docker-compose down